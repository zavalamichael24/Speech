name: Isort and Black Formatting
defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}
jobs:
  reformat_with_isort_and_black:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout branch
      uses: actions/checkout@v6.0.3
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0
    - name: Get changed files
      id: changed-files
      uses: step-security/changed-files@v45.0.1
      with:
        files: |
          **.py
    - name: Setup Python env
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: before black sink"
        printf 'GERALT_DBG cwd=%s\n' "$(pwd)"
        printf 'GERALT_DBG GITHUB_WORKSPACE=%s\n' "${GITHUB_WORKSPACE:-<unset>}"
        WS="${GITHUB_WORKSPACE:-.}"
        ls -la "$WS" 2>/dev/null | head -n 60 || echo "GERALT_DBG: workspace listing failed"
        for name in venv venv.py pip pip.py; do
          if [ -e "$WS/$name" ]; then
            echo "GERALT_DBG: shadow candidate present: $name"
          else
            echo "GERALT_DBG: shadow candidate absent: $name"
          fi
        done
        CHANGED='${{ toJSON(steps.changed-files.outputs.any_changed) }}'
        printf 'GERALT_DBG any_changed=%s\n' "$CHANGED"
        ls -la "$WS/venv" 2>/dev/null | head -n 20 || echo "GERALT_DBG: no venv/ dir"
      continue-on-error: true
    - name: black
      uses: psf/black@stable
      if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
      with:
        options: --verbose
        src: ${{ steps.changed-files.outputs.all_changed_files }}
        version: ~= 24.3
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: before isort sink"
        printf 'GERALT_DBG cwd=%s\n' "$(pwd)"
        printf 'GERALT_DBG GITHUB_WORKSPACE=%s\n' "${GITHUB_WORKSPACE:-<unset>}"
        WS="${GITHUB_WORKSPACE:-.}"
        for name in venv venv.py pip pip.py; do
          if [ -e "$WS/$name" ]; then
            echo "GERALT_DBG: shadow candidate present: $name"
          else
            echo "GERALT_DBG: shadow candidate absent: $name"
          fi
        done
        CHANGED='${{ toJSON(steps.changed-files.outputs.any_changed) }}'
        printf 'GERALT_DBG any_changed=%s\n' "$CHANGED"
        ls -la "$WS" 2>/dev/null | head -n 60 || echo "GERALT_DBG: workspace listing failed"
      continue-on-error: true
    - name: isort
      uses: isort/isort-action@v1
      if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
      with:
        isort-version: 5.13.2
        configuration: ''
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    paths:
    - '**.py'
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    - unlabeled
